<div class="min-h-screen bg-slate-100 text-slate-800 font-sans flex flex-col antialiased">
  <!-- Sidebar -->
  <app-sidebar
    [mobileOpen]="mobileNavOpen()"
    (closeMobile)="closeMobileNav()"
  />

  <!-- Main Content Wrapper (offset by sidebar width) -->
  <div 
    class="flex-1 flex flex-col transition-all duration-300 ease-in-out"
    [class.lg:pl-72]="!sidebar()?.collapsed()"
    [class.lg:pl-20]="sidebar()?.collapsed()"
  >
    <!-- Topbar -->
    <app-topbar (toggleMobile)="toggleMobileNav()" />

    <!-- Page Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto py-6 sm:py-8 px-4 sm:px-6 lg:px-8 space-y-6">
      <router-outlet />
    </main>
  </div>
</div>
